<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131a26" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#grad)" rx="12"/>
  <!-- Windbreaker silhouette -->
  <path d="M 70,30 L 100,50 L 130,30 L 150,55 L 180,90 L 160,110 L 150,100 L 150,210 L 50,210 L 50,100 L 40,110 L 20,90 L 50,55 Z" fill="#1b2436" stroke="#3b82f6" stroke-width="2"/>
  <!-- Zipper line -->
  <line x1="100" y1="50" x2="100" y2="210" stroke="#d4af37" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="100" y="140" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">WINDBREAKER</text>
  <text x="100" y="160" font-family="'Outfit', sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Adidas Jacket</text>
</svg>
