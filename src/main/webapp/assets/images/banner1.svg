<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Base Background -->
  <rect width="1200" height="480" fill="url(#grad1)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  
  <!-- Ambient Lights -->
  <rect width="1200" height="480" fill="url(#glow1)"/>
  <rect width="1200" height="480" fill="url(#glow2)"/>
  
  <!-- Modern Geometric Accent Elements on the Right Side -->
  <g opacity="0.4" transform="translate(750, 40)">
    <circle cx="200" cy="180" r="160" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="200" cy="180" r="120" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
    <polygon points="200,60 290,240 110,240" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="340" cy="80" r="6" fill="#d4af37"/>
    <circle cx="80" cy="300" r="4" fill="#3b82f6"/>
  </g>
</svg>
